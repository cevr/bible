<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Play · righteousness-by-faith</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;650&display=swap"
    />
    <link rel="stylesheet" href="../../packages/film/src/player/tokens.css" />
    <link rel="stylesheet" href="kit.css" />
    <link rel="stylesheet" href="lab.css" />
    <style>
      /* ── Page: Play, the picture and its HUD ───────────────────────── */
      .hud {
        background: var(--surface-1);
        padding: 0 calc(var(--gutter) - var(--s-1)) var(--s-3);
      }
      .hud .transport {
        padding: 0;
      }
      .hud .say b {
        color: var(--accent);
      }
      .hud .icon-btn[data-pressed] {
        font-size: var(--fs-2);
        font-weight: var(--w-2);
      }
      .hud .bands {
        margin: 0 var(--s-1);
      }
      @media (min-width: 900px) {
        .work {
          height: calc(100dvh - var(--header-h));
        }
        .main {
          grid-template-rows: minmax(0, 1fr) auto;
          height: 100%;
        }
        .viewer {
          display: grid;
          place-items: center;
          min-height: 0;
          padding: var(--s-3);
          container-type: size;
        }
        .viewer .pic {
          width: min(100cqw - 24px, (100cqh - 24px) * 16 / 9);
          height: auto;
        }
      }
      @media (max-width: 899px) {
        .viewer {
          min-height: calc(100dvh - var(--header-h) - var(--tabbar-h) - 96px);
          display: grid;
          align-items: center;
        }
        .hud {
          position: fixed;
          left: 0;
          right: 0;
          bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
          z-index: 25;
          border-top: var(--border);
        }
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute">
      <symbol id="i-films" viewBox="0 0 24 24">
        <rect x="3.5" y="3.5" width="7" height="7" />
        <rect x="13.5" y="3.5" width="7" height="7" />
        <rect x="3.5" y="13.5" width="7" height="7" />
        <rect x="13.5" y="13.5" width="7" height="7" />
      </symbol>
      <symbol id="i-scenes" viewBox="0 0 24 24">
        <rect x="2.5" y="5.5" width="19" height="13" />
        <path d="M8.5 5.5v13M15.5 5.5v13" />
      </symbol>
      <symbol id="i-lab" viewBox="0 0 24 24">
        <path d="M4 7h9M17 7h3M4 17h3M11 17h9" />
        <circle cx="15" cy="7" r="2" />
        <circle cx="9" cy="17" r="2" />
      </symbol>
      <symbol id="i-choices" viewBox="0 0 24 24">
        <path d="M4 6h16M4 12h16M4 18h8" />
        <path d="M15 17.5l2 2 3.5-4" />
      </symbol>
      <symbol id="i-project" viewBox="0 0 24 24">
        <rect x="3.5" y="3.5" width="17" height="17" />
        <path d="M8 12.5l3 3 5-6" />
      </symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5l12 7.5-12 7.5z" /></symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="6" />
        <path d="M16 16l4 4" />
      </symbol>
      <symbol id="i-more" viewBox="0 0 24 24">
        <circle cx="5" cy="12" r="1.6" />
        <circle cx="12" cy="12" r="1.6" />
        <circle cx="19" cy="12" r="1.6" />
      </symbol>
      <symbol id="i-chev" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5" /></symbol>
    </svg>

    <header class="hdr">
      <button class="home ph" aria-label="Films">
        <svg class="i"><use href="#i-films" /></svg>
      </button>
      <nav class="pagebar" aria-label="Pages">
        <a class="films" href="films.html"
          ><svg class="i"><use href="#i-films" /></svg>Films</a
        >
        <span class="vsep lap" style="align-self: center"></span>
        <button class="switcher lap" aria-haspopup="menu">
          <span>righteousness-by-faith</span><svg class="i"><use href="#i-chev" /></svg>
        </button>
        <a href="scenes.html"
          ><svg class="i"><use href="#i-scenes" /></svg>Scenes</a
        >
        <a href="lab.html"
          ><svg class="i"><use href="#i-lab" /></svg>Lab</a
        >
        <a href="choices.html"
          ><svg class="i"><use href="#i-choices" /></svg>Choices</a
        >
        <a href="project.html"
          ><svg class="i"><use href="#i-project" /></svg>Project</a
        >
        <a href="play.html" data-active aria-current="page"
          ><svg class="i"><use href="#i-play" /></svg>Play</a
        >
      </nav>
      <button class="switcher ph" aria-haspopup="menu">
        <span>righteousness-by-faith</span><svg class="i"><use href="#i-chev" /></svg>
      </button>
      <span class="spacer"></span>
      <output class="tc lap">00<i>:</i>00<i>:</i>09<i>:</i><span class="ff">15</span></output>
      <span class="cmdk lap"
        ><svg class="i" style="width: 14px; height: 14px"><use href="#i-search" /></svg>Go to…
        <kbd>⌘K</kbd></span
      >
      <button class="icon-btn ph" aria-label="Command menu">
        <svg class="i"><use href="#i-search" /></svg>
      </button>
      <button class="icon-btn" aria-label="View menu">
        <svg class="i fill"><use href="#i-more" /></svg>
      </button>
    </header>

    <div class="work">
      <div class="main">
        <div class="viewer">
          <div class="pic">
            <img src="stills/big-cold.jpg" alt="cold at 9.5 s" />
          </div>
        </div>
        <div class="hud" data-hud="shown">
          <div class="transport">
            <button class="play" aria-label="Play">
              <svg class="i fill"><use href="#i-play" /></svg>
            </button>
            <span class="tc-s ph">00<i>:</i>00<i>:</i>09<i>:</i>15</span>
            <span class="tc-s"><i>/ 00:08:45:26</i></span>
            <span class="say"><b>cold</b></span>
            <button class="icon-btn" data-pressed aria-label="Captions" aria-pressed="true">
              CC
            </button>
          </div>
          <div class="bands" id="bands"></div>
        </div>
      </div>
    </div>

    <script>
      const DUR = 525.9,
        T = 9.5;
      const S = [
        ['cold', 0, 25.19],
        ['title', 25.19, 3],
        ['word', 28.19, 19.44],
        ['mirror', 47.63, 22.85],
        ['message', 70.49, 43.46],
        ['roof', 113.95, 41.98],
        ['woman', 155.93, 38.47],
        ['spoke', 194.41, 20.01],
        ['centurion', 214.42, 26.93],
        ['look', 241.35, 28.19],
        ['declared', 269.55, 25.27],
        ['exchange', 294.82, 26.98],
        ['accuser', 321.8, 24.99],
        ['robe', 346.79, 27.97],
        ['within', 374.77, 28.05],
        ['daily', 402.82, 23.52],
        ['rain', 426.34, 14.6],
        ['name', 440.94, 24.95],
        ['thesis', 465.89, 30],
        ['end', 495.9, 30],
      ];
      const FIND = {
        word: 3,
        mirror: 1,
        message: 2,
        roof: 4,
        spoke: 1,
        centurion: 1,
        look: 2,
        declared: 1,
        exchange: 1,
        robe: 1,
        rain: 2,
        within: 1,
      };
      const hue = (i) => `hsl(${(i * 47) % 360} var(--scene-sat) var(--scene-light))`;
      const bands = document.getElementById('bands');
      const wide = matchMedia('(min-width: 900px)').matches;
      S.forEach(([n, st, d], i) =>
        bands.insertAdjacentHTML(
          'beforeend',
          `<div class="seg" ${i === 0 ? 'data-current' : ''} style="left:${(st / DUR) * 100}%;width:${(d / DUR) * 100}%;background:${hue(i)}">${wide && d > 18 ? `<b>${n}</b>` : ''}${FIND[n] ? '<i class="f"></i>' : ''}</div>`,
        ),
      );
      bands.insertAdjacentHTML(
        'beforeend',
        `<div class="head" style="left:${(T / DUR) * 100}%"></div>`,
      );
    </script>
  </body>
</html>
