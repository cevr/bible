<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Folder · righteousness-by-faith · Project</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;650&display=swap"
    />
    <link rel="stylesheet" href="../../packages/film/src/player/tokens.css" />
    <link rel="stylesheet" href="kit.css" />
    <style>
      /* ── Page: a Folder of renders, under its film's Project (DL-11) ── */
      .work {
        display: grid;
        gap: var(--hairline);
        background: var(--surface-0);
        align-content: start;
      }
      @media (min-width: 900px) {
        .work {
          min-height: calc(100dvh - var(--header-h));
        }
      }
      .sum {
        padding: var(--s-3) var(--gutter);
        font-size: var(--fs-3);
        color: var(--text-2);
        border-bottom: var(--border);
      }
      .sum .n {
        color: var(--text-1);
      }
      /* A panel's menu keeps its full target in the shorter panel head; its glyph sits on the gutter. */
      .phead .icon-btn {
        margin-block: calc((var(--panel-head-h) - var(--hit)) / 2);
        margin-inline-end: calc((var(--s-4) - var(--hit)) / 2);
      }
      /* The code's rule for a folder's sets (`.rv-grid.rv-wide`): one column on the phone, three at 1440. */
      .grid {
        display: grid;
        gap: var(--s-3);
        padding: var(--s-3) var(--gutter) var(--s-4);
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr));
      }
      /* A version stack: its still and its scene. A count shows only from two versions. */
      .card {
        background: var(--surface-2);
        border: var(--border);
        border-radius: var(--r-1);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-width: 0;
        color: inherit;
        text-decoration: none;
      }
      .card .pic {
        position: relative;
        background: var(--surface-0);
      }
      .card .name {
        padding: var(--s-2) var(--s-3) var(--s-3);
        font-weight: var(--w-3);
        font-size: var(--fs-4);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      @media (min-width: 900px) {
        .card .name {
          font-size: var(--fs-3);
        }
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute">
      <symbol id="i-films" viewBox="0 0 24 24">
        <rect x="3.5" y="3.5" width="7" height="7" />
        <rect x="13.5" y="3.5" width="7" height="7" />
        <rect x="3.5" y="13.5" width="7" height="7" />
        <rect x="13.5" y="13.5" width="7" height="7" />
      </symbol>
      <symbol id="i-scenes" viewBox="0 0 24 24">
        <rect x="2.5" y="5.5" width="19" height="13" />
        <path d="M8.5 5.5v13M15.5 5.5v13" />
      </symbol>
      <symbol id="i-lab" viewBox="0 0 24 24">
        <path d="M4 7h9M17 7h3M4 17h3M11 17h9" />
        <circle cx="15" cy="7" r="2" />
        <circle cx="9" cy="17" r="2" />
      </symbol>
      <symbol id="i-choices" viewBox="0 0 24 24">
        <path d="M4 6h16M4 12h16M4 18h8" />
        <path d="M15 17.5l2 2 3.5-4" />
      </symbol>
      <symbol id="i-project" viewBox="0 0 24 24">
        <rect x="3.5" y="3.5" width="17" height="17" />
        <path d="M8 12.5l3 3 5-6" />
      </symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5l12 7.5-12 7.5z" /></symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="6" />
        <path d="M16 16l4 4" />
      </symbol>
      <symbol id="i-more" viewBox="0 0 24 24">
        <circle cx="5" cy="12" r="1.6" />
        <circle cx="12" cy="12" r="1.6" />
        <circle cx="19" cy="12" r="1.6" />
      </symbol>
      <symbol id="i-chev" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5" /></symbol>
      <symbol id="i-right" viewBox="0 0 24 24"><path d="M10 7l5 5-5 5" /></symbol>
    </svg>

    <header class="hdr">
      <button class="home ph" aria-label="Films">
        <svg class="i"><use href="#i-films" /></svg>
      </button>
      <nav class="pagebar" aria-label="Pages">
        <a class="films" href="films.html"
          ><svg class="i"><use href="#i-films" /></svg>Films</a
        >
        <span class="vsep lap" style="align-self: center"></span>
        <button class="switcher lap" aria-haspopup="menu">
          <span>righteousness-by-faith</span><svg class="i"><use href="#i-chev" /></svg>
        </button>
        <a href="scenes.html"
          ><svg class="i"><use href="#i-scenes" /></svg>Scenes</a
        >
        <a href="lab.html"
          ><svg class="i"><use href="#i-lab" /></svg>Lab</a
        >
        <a href="choices.html"
          ><svg class="i"><use href="#i-choices" /></svg>Choices</a
        >
        <a href="project.html" data-active aria-current="page"
          ><svg class="i"><use href="#i-project" /></svg>Project</a
        >
        <a href="play.html"
          ><svg class="i"><use href="#i-play" /></svg>Play</a
        >
      </nav>
      <span class="crumb lap"
        ><svg class="i"><use href="#i-right" /></svg><b>righteousness-by-faith · renders</b></span
      >
      <span class="crumb ph" style="padding-left: var(--s-1)"
        ><b>righteousness-by-faith · renders</b></span
      >
      <span class="spacer"></span>
      <span class="cmdk lap"
        ><svg class="i" style="width: 14px; height: 14px"><use href="#i-search" /></svg>Go to…
        <kbd>⌘K</kbd></span
      >
      <button class="icon-btn ph" aria-label="Command menu">
        <svg class="i"><use href="#i-search" /></svg>
      </button>
      <button class="icon-btn" aria-label="View menu">
        <svg class="i fill"><use href="#i-more" /></svg>
      </button>
    </header>

    <div class="work">
      <section class="panel">
        <div class="sum"><span class="n">21</span> renders, <span class="n">0</span> approved</div>
        <div class="phead">
          <h2>Versions</h2>
          <span class="meta">20</span><span class="spacer"></span>
          <button class="icon-btn" aria-label="Folder menu: docs and downloads">
            <svg class="i fill"><use href="#i-more" /></svg>
          </button>
        </div>
        <div class="grid" id="sets"></div>
      </section>
    </div>
    <script>
      // The folder's version stacks: one per scene, each holding one version (main), so no card shows a count.
      const SCENES = [
        'cold',
        'title',
        'word',
        'mirror',
        'message',
        'roof',
        'woman',
        'spoke',
        'centurion',
        'look',
        'declared',
        'exchange',
        'accuser',
        'robe',
        'within',
        'daily',
        'rain',
        'name',
        'thesis',
        'end',
      ];
      document.getElementById('sets').innerHTML = SCENES.map(
        (n) => `<a class="card" href="set.html">
  <div class="pic"><img src="stills/poster-${n}.jpg" alt="${n}" loading="lazy" /></div>
  <div class="name">scene ${n}</div>
</a>`,
      ).join('');
    </script>
  </body>
</html>
