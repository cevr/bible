[test]
# The browser E2E tests run their cases at once: each holds a view lent from the
# worker's one Chrome, on an origin of its own (src/lab/fixtures/browsers.ts). The test script's
# --max-concurrency=3 (bunfig has no key for it) holds a worker to three cases
# at a time; the E2E script sizes --parallel by the host (src/lab/fixtures/workers.ts:
# on CI at most eight, one per core on smaller hosts; on a shared machine the
# cores free when it starts), so at most three pages a worker. Unbound,
# every case in a file shares the cores with all its siblings and takes the
# whole file's time: on a loaded 4-core runner a case that takes 0.5 s alone
# took 13-15 s. A case waiting for its turn has not started, so its timeout
# counts its own work only. The lab-page tests run their cases at once too:
# each serves an app in a temp folder of its own and spends its time waiting
# on that folder's watch (a second that must stay quiet, a save that must be
# heard), about 0.5 s of work in 3-4.5 s a file run one case after another,
# a worker's slot held idle the rest.
concurrentTestGlob = ["**/*.dom.test.ts", "**/*.pixel.test.ts", "**/lab-page-*.test.ts"]
# The browser-free tests' time limit for effect-bun-test's runners, which
# interrupt a concurrent case at it: bun's own 5 s (src/lab/fixtures/test-timeout.ts).
# The browser suite's script preloads its own limit after this one
# (e2e/preload.ts) and passes it as --timeout too, since bun keeps a preload's
# default for a process's first file only.
preload = ["./src/lab/fixtures/preload.ts"]
