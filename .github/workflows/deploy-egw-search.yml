# egw.cvr.im (apps/egw-search): `prod` on main, a `pr-<n>` preview per pull
# request that touches it or the packages it is built from, and a teardown
# when that pull request closes. Every stage reads the one shared corpus in D1
# and Vectorize; a teardown removes only its Worker.
# gate.yml checks the whole repository; this workflow checks the app itself
# before it deploys. CI owns `prod`: a local deploy builds a bundle that
# hashes differently, so use a throwaway stage for local work.
name: deploy-egw-search

on:
  push:
    branches: [main]
    paths:
      - 'apps/egw-search/**'
      - 'packages/core/**'
      - 'packages/atom-solid/**'
      - 'packages/url-state/**'
      - 'packages/ui/**'
      - 'bun.lock'
      - 'package.json'
      - '.github/workflows/deploy-egw-search.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'apps/egw-search/**'
      - 'packages/core/**'
      - 'packages/atom-solid/**'
      - 'packages/url-state/**'
      - 'packages/ui/**'
      - 'bun.lock'
      - 'package.json'
      - '.github/workflows/deploy-egw-search.yml'

concurrency:
  group: deploy-egw-search-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'prod' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  LEFTHOOK: 0
  TURBO_TELEMETRY_DISABLED: '1'
  STAGE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'prod' }}
  # Provider credentials. Profiles are never read when CI=true.
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

defaults:
  run:
    working-directory: apps/egw-search

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx turbo run gate --filter=@bible/egw-search
      - run: bun run build
      - run: bunx alchemy provider check-env --provider Cloudflare
      - run: bunx alchemy deploy alchemy.run.ts --stage "$STAGE" --yes
        env:
          # Bound to the sync's Worker as secrets (`server/cloudflare/Sync.ts`).
          EGW_CLIENT_ID: ${{ secrets.EGW_CLIENT_ID }}
          EGW_CLIENT_SECRET: ${{ secrets.EGW_CLIENT_SECRET }}

  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Destroy the preview stage
        run: |
          case "$STAGE" in pr-*) ;; *) echo "refusing to destroy $STAGE"; exit 1 ;; esac
          bun run build
          bunx alchemy destroy alchemy.run.ts --stage "$STAGE" --yes
        env:
          # The stack reads them while it plans, destroy included.
          EGW_CLIENT_ID: ${{ secrets.EGW_CLIENT_ID }}
          EGW_CLIENT_SECRET: ${{ secrets.EGW_CLIENT_SECRET }}
