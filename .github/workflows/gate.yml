# The gate, as `bun run gate` runs it locally (`packages/scripts/src/gate.sh`):
# first the checks, lint, the format check, the dead exports and every
# package's typecheck and build, and after its build a package's own `gate`
# script where it has one (firsttheblade's built pages' contrast, in the
# runner's Google Chrome); then each workspace's tests alone, one after
# another. CI keeps no turbo cache, so every task runs. The hooks run only the staged-file lint and
# format. CI runs the gate alone (owner, 2026-10-19: "gate only"): the browser
# tests (the film's e2e, @bible/ui's, atom-solid's hydration, egw-search's
# page) are tools a unit runs by hand, and no agent reads this workflow's runs.

name: gate

on:
  pull_request:
  push:
    branches: [main]

# A pull request's newer push cancels its older run. Every commit on main gets
# its own group, so a commit's run on main is never cancelled by the commit
# pushed after it.
concurrency:
  group: gate-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'
  FORCE_COLOR: '1'

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The dead-export debt is held against what the change started from: the pull
      # request's base, or the push's pre-push commit (all zeros for a new branch,
      # which the check reads as no base named).
      DEAD_EXPORTS_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
    steps:
      # The whole history: the dead-export check reads the debt at its base revision.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          # `packageManager` in package.json pins the version (bun@x.y.z).
          bun-version-file: package.json
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile

      # EmbeddingGemma's weights are not committed (core §10). Core's adapter
      # parity test loads the model, and with nothing in the cache it reads it
      # downloads the weights itself on every run: they are fetched once into a
      # cache the embedder reads by BIBLE_MODEL_CACHE.
      - name: Cache the embedding model
        id: model
        uses: actions/cache@v4
        with:
          path: ~/.cache/bible-models
          key: embeddinggemma-300m-onnx-fp32-v1
      - name: Fetch the embedding model
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          base=https://huggingface.co/onnx-community/embeddinggemma-300m-ONNX/resolve/main
          dir="$HOME/.cache/bible-models/onnx-community/embeddinggemma-300m-ONNX"
          for file in config.json tokenizer.json tokenizer_config.json onnx/model.onnx onnx/model.onnx_data; do
            curl -fsSL --retry 3 --create-dirs -o "$dir/$file" "$base/$file"
          done
      - name: Point the embedder at the model
        run: echo "BIBLE_MODEL_CACHE=$HOME/.cache/bible-models" >> "$GITHUB_ENV"

      - run: bun run gate
