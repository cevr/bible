# The gate, as `bun run gate` runs it locally: lint and the format check, then
# every package's typecheck, build and tests through turbo. CI keeps no turbo
# cache, so every task runs. The hooks run only the staged-file lint and
# format. The browser tests (the film's and @bible/ui's) run in the `e2e` job
# beside it. `bun run ci <commit>` waits for this workflow's run on a commit on
# main and prints its verdict.

name: gate

on:
  pull_request:
  push:
    branches: [main]

# A pull request's newer push cancels its older run. Every commit on main gets
# its own group, so a commit's run on main is never cancelled by the commit
# pushed after it.
concurrency:
  group: gate-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'
  FORCE_COLOR: '1'

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # `packageManager` in package.json pins the version (bun@x.y.z).
          bun-version-file: package.json
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile

      # EmbeddingGemma's weights are not committed (core §10). Core's adapter
      # parity test loads the model, and with nothing in the cache it reads it
      # downloads the weights itself on every run: they are fetched once into a
      # cache the embedder reads by BIBLE_MODEL_CACHE.
      - name: Cache the embedding model
        id: model
        uses: actions/cache@v4
        with:
          path: ~/.cache/bible-models
          key: embeddinggemma-300m-onnx-fp32-v1
      - name: Fetch the embedding model
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          base=https://huggingface.co/onnx-community/embeddinggemma-300m-ONNX/resolve/main
          dir="$HOME/.cache/bible-models/onnx-community/embeddinggemma-300m-ONNX"
          for file in config.json tokenizer.json tokenizer_config.json onnx/model.onnx onnx/model.onnx_data; do
            curl -fsSL --retry 3 --create-dirs -o "$dir/$file" "$base/$file"
          done
      - name: Point the embedder at the model
        run: echo "BIBLE_MODEL_CACHE=$HOME/.cache/bible-models" >> "$GITHUB_ENV"

      - run: bun run gate

  # The browser tests: the film's (`bun run test:e2e`: the lab, review and
  # player pages over Chrome through Bun.WebView) and @bible/ui's (`bun run
  # test:browser`: its parts in Playwright's Chromium). They need a browser, so
  # they run in a job of their own beside the gate; the runner image carries
  # Google Chrome, named to Bun by BUN_CHROME_PATH
  # (packages/film/src/tools/chrome.ts), and Playwright installs its Chromium.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Point Bun at the runner's Chrome
        run: echo "BUN_CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - run: bun run test:e2e
      - name: Install Playwright's Chromium
        working-directory: packages/ui
        run: bunx playwright install --with-deps chromium
      - name: '@bible/ui browser tests'
        working-directory: packages/ui
        run: bun run test:browser
