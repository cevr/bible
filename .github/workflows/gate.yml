# The gate, as `bun run gate` runs it locally: lint and the format check, then
# every package's typecheck, build and tests through turbo. CI keeps no turbo
# cache, so every task runs. The hooks run only the staged-file lint and
# format. `bun run ci <commit>` waits for this workflow's run on a commit on
# main and prints its verdict.

name: gate

on:
  pull_request:
  push:
    branches: [main]

# A pull request's newer push cancels its older run. Every commit on main gets
# its own group, so a commit's run on main is never cancelled by the commit
# pushed after it.
concurrency:
  group: gate-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'
  FORCE_COLOR: '1'

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # `packageManager` in package.json pins the version (bun@x.y.z).
          bun-version-file: package.json
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile

      # Headless Chromium for the film framework's lab and canvas tests
      # (packages/film's *.dom.test.ts), at playwright-core's version.
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('packages/film/package.json') }}
      # Its system libraries come through apt, whose mirror sometimes stalls for
      # many minutes: each attempt has 6 minutes, and a stalled one is tried
      # once more before this named step fails the job.
      - name: Install Chromium
        id: install-chromium
        continue-on-error: true
        timeout-minutes: 6
        working-directory: packages/film
        run: bun x playwright-core install --with-deps chromium chromium-headless-shell
      - name: Install Chromium, second attempt
        if: steps.install-chromium.outcome == 'failure'
        timeout-minutes: 6
        working-directory: packages/film
        run: |
          sudo dpkg --configure -a
          bun x playwright-core install --with-deps chromium chromium-headless-shell

      # EmbeddingGemma's weights are not committed (core §10). Core's adapter
      # parity test loads the model, and with nothing in the cache it reads it
      # downloads the weights itself on every run: they are fetched once into a
      # cache the embedder reads by BIBLE_MODEL_CACHE.
      - name: Cache the embedding model
        id: model
        uses: actions/cache@v4
        with:
          path: ~/.cache/bible-models
          key: embeddinggemma-300m-onnx-fp32-v1
      - name: Fetch the embedding model
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          base=https://huggingface.co/onnx-community/embeddinggemma-300m-ONNX/resolve/main
          dir="$HOME/.cache/bible-models/onnx-community/embeddinggemma-300m-ONNX"
          for file in config.json tokenizer.json tokenizer_config.json onnx/model.onnx onnx/model.onnx_data; do
            curl -fsSL --retry 3 --create-dirs -o "$dir/$file" "$base/$file"
          done
      - name: Point the embedder at the model
        run: echo "BIBLE_MODEL_CACHE=$HOME/.cache/bible-models" >> "$GITHUB_ENV"

      - run: bun run gate
