name: Set up the workspace
description: Bun at the repository's version, the locked install, and turbo's local cache.

inputs:
  turbo-key:
    description: Names this job's turbo cache, so jobs that run different tasks keep their own.
    required: true

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        # `packageManager` in package.json pins the version (bun@x.y.z).
        bun-version-file: package.json

    - uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    - shell: bash
      run: bun install --frozen-lockfile

    # Typecheck and build are cached by turbo; tests are not (`cache: false`).
    - uses: actions/cache@v4
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ inputs.turbo-key }}-${{ github.sha }}
        restore-keys: turbo-${{ runner.os }}-${{ inputs.turbo-key }}-
