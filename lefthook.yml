pre-commit:
  jobs:
    # Budget: under 5 s. Only the staged files are linted (with fixes) and
    # formatted; stage_fixed re-stages what the tools rewrote. The whole gate
    # (typecheck, tests, perf) runs in CI, and by hand between units.
    - name: lint
      glob: '*.{ts,tsx,js,jsx,mts,cts}'
      run: bun x oxlint --fix {staged_files}
      stage_fixed: true

    - name: fmt
      run: bun x oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    # Guard rail: animations + keyframes in apps/desktop/src belong in
    # the <Motion> lib, not raw CSS. CSS transitions are fine (hover/focus
    # state changes) — only @keyframes and the `animation:` shorthand
    # property are flagged. Scoped to desktop because that's the only
    # package on the motion lib today.
    - name: no-raw-css-animation
      glob: 'apps/desktop/src/**/*.css'
      run: |
        if grep -nE '(^|\s)(animation:|@keyframes\s)' {staged_files}; then
          echo ""
          echo "Hand-rolled CSS animations in apps/desktop/src/ — use <Motion>"
          echo "(see apps/desktop/src/motion/index.ts) or remove them. CSS"
          echo "transitions for hover/focus state changes are allowed."
          exit 1
        fi

    # Guard rail: this repo is public, and ElevenLabs' terms forbid
    # distributing generated sound effects or music as files. The film sound
    # library refuses any staged audio that is a generated sound (under
    # sounds/files, or a copy of one anywhere, by its hash), a film's generated
    # score (anything under a film's sound/, or a copy of an option its
    # manifest records, by its hash), or sits under sounds/public without being
    # a CC0 variant in the lock. See apps/animations/sounds.
    #
    # Tagged repo-guard: CI runs the repo-guard jobs over every tracked file
    # (`lefthook run pre-commit --all-files --tag repo-guard`), so a commit made
    # with --no-verify, on the web or from a clone without lefthook is refused
    # there.
    - name: sound-licence
      tags: [repo-guard]
      glob: '**/*.{flac,wav,mp3,ogg,opus,m4a,aac,aif,aiff,FLAC,WAV,MP3}'
      run: bun apps/animations/cli.ts sfx guard {staged_files}

    # Guard rail: `git stash` is one ref every worktree of this repository
    # shares, so a batch's `stash pop` in one worktree takes the entry another
    # batch pushed in its own, and that batch's work is lost. While other
    # worktrees exist, a stash entry left behind refuses the commit and the
    # gate (`bun run guard` runs the repo-guard jobs), naming each entry.
    # Lefthook's own "lefthook auto backup" entry, which it pushes and pops
    # around a hook run on a partly staged file, is not one. No glob: it runs
    # on every commit, in well under a second.
    - name: no-shared-stash
      tags: [repo-guard]
      run: |
        left="$(git stash list | grep -v ': lefthook auto backup$' || true)"
        if [ "$(git worktree list | wc -l)" -gt 1 ] && [ -n "$left" ]; then
          echo "git stash holds entries while other worktrees share it:"
          echo "$left"
          echo "The stash is shared by every worktree: another worktree's pop takes these."
          echo "Put each back where it belongs (git stash show -p <entry>), then drop it."
          echo "Read old code with git show <commit>:<path>; never git stash."
          exit 1
        fi

    # Guard rail: a render carries the film's mix, and the mix carries the
    # generated score and effects, so no video (or m4a) is committed under the
    # films or their framework. The only ones allowed are the renderer's test
    # segments (packages/film/src/tools/fixtures), which carry a test tone.
    # Renders live in apps/animations/out (ignored) and the private media store.
    - name: no-renders
      tags: [repo-guard]
      glob: '{apps/animations,packages/film}/**.{mp4,m4v,mov,webm,mkv,m4a,MP4,MOV}'
      exclude:
        - 'packages/film/src/tools/fixtures/*.mp4'
      run: |
        echo "Renders may not be committed (they carry the generated score):"
        printf '  %s\n' {staged_files}
        echo "Keep renders in apps/animations/out or the media store (film media push)."
        exit 1
