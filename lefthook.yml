pre-commit:
  jobs:
    # Budget: under 5 s. Only the staged files are linted (with fixes) and
    # formatted; stage_fixed re-stages what the tools rewrote. The gate
    # (typecheck, build, tests) runs in CI, and by hand between units.
    - name: lint
      glob: '*.{ts,tsx,js,jsx,mts,cts}'
      run: bun x oxlint --fix {staged_files}
      stage_fixed: true

    - name: fmt
      run: bun x oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    # Guard rail: animations + keyframes in apps/desktop/src belong in
    # the <Motion> lib, not raw CSS. CSS transitions are fine (hover/focus
    # state changes) — only @keyframes and the `animation:` shorthand
    # property are flagged. Scoped to desktop because that's the only
    # package on the motion lib today.
    - name: no-raw-css-animation
      glob: 'apps/desktop/src/**/*.css'
      run: |
        if grep -nE '(^|\s)(animation:|@keyframes\s)' {staged_files}; then
          echo ""
          echo "Hand-rolled CSS animations in apps/desktop/src/ — use <Motion>"
          echo "(see apps/desktop/src/motion/index.ts) or remove them. CSS"
          echo "transitions for hover/focus state changes are allowed."
          exit 1
        fi

    # Guard rail: a render carries the film's mix, and the mix carries the
    # generated score and effects, so no video (or m4a) is committed under the
    # films or their framework. The only ones allowed are the renderer's test
    # segments (packages/film/src/tools/fixtures), which carry a test tone.
    # Renders live in apps/animations/out (ignored) and the private media store.
    - name: no-renders
      glob: '{apps/animations,packages/film}/**.{mp4,m4v,mov,webm,mkv,m4a,MP4,MOV}'
      exclude:
        - 'packages/film/src/tools/fixtures/*.mp4'
      run: |
        echo "Renders may not be committed (they carry the generated score):"
        printf '  %s\n' {staged_files}
        echo "Keep renders in apps/animations/out or the media store (film media push)."
        exit 1
