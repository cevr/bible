pre-commit:
  jobs:
    # gate:fix runs lint --fix + fmt first (auto-merges duplicate imports,
    # reorders, etc.), then re-runs the readonly gate to make sure the fixes
    # hold. stage_fixed re-stages anything the formatters/linter rewrote.
    - name: gate
      run: bun run gate:fix
      stage_fixed: true

    # Guard rail: animations + keyframes in apps/desktop/src belong in
    # the <Motion> lib, not raw CSS. CSS transitions are fine (hover/focus
    # state changes) — only @keyframes and the `animation:` shorthand
    # property are flagged. Scoped to desktop because that's the only
    # package on the motion lib today.
    - name: no-raw-css-animation
      glob: 'apps/desktop/src/**/*.css'
      run: |
        if grep -nE '(^|\s)(animation:|@keyframes\s)' {staged_files}; then
          echo ""
          echo "Hand-rolled CSS animations in apps/desktop/src/ — use <Motion>"
          echo "(see apps/desktop/src/motion/index.ts) or remove them. CSS"
          echo "transitions for hover/focus state changes are allowed."
          exit 1
        fi

    # Guard rail: this repo is public, and ElevenLabs' terms forbid
    # distributing generated sound effects or music as files. The film sound
    # library refuses any staged audio that is a generated sound (under
    # sounds/files, or a copy of one anywhere, by its hash), a film's generated
    # score (anything under a film's sound/, or a copy of an option its
    # manifest records, by its hash), or sits under sounds/public without being
    # a CC0 variant in the lock. See apps/animations/sounds.
    - name: sound-licence
      glob: '**/*.{flac,wav,mp3,ogg,opus,m4a,aac,aif,aiff,FLAC,WAV,MP3}'
      run: bun apps/animations/cli.ts sfx guard {staged_files}
